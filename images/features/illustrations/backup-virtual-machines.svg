<svg viewBox="0 0 500 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Several virtual machines running on a host being captured into a scheduled, restorable backup">
  <!-- soft background depth -->
  <defs>
    <radialGradient id="illGlowTR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E9DCFF" stop-opacity="0.85"/>
      <stop offset="20%" stop-color="#EBDFFF" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#EEE5FF" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#F1EAFF" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#F4F0FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F5F0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="illGlowBL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DBC8FF" stop-opacity="0.75"/>
      <stop offset="20%" stop-color="#DFCEFF" stop-opacity="0.62"/>
      <stop offset="40%" stop-color="#E4D6FF" stop-opacity="0.44"/>
      <stop offset="60%" stop-color="#E9DEFF" stop-opacity="0.26"/>
      <stop offset="80%" stop-color="#EDE5FF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#EDE5FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="illSoften" x="-100" y="-100" width="700" height="480" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <circle cx="424" cy="60" r="165" fill="url(#illGlowTR)" filter="url(#illSoften)"/>
  <circle cx="55" cy="248" r="135" fill="url(#illGlowBL)" filter="url(#illSoften)"/>
  <circle cx="472" cy="238" r="4" fill="#D9CCFF"/>
  <circle cx="26" cy="64" r="3" fill="#B899F7"/>

  <!-- ground shadow -->
  <ellipse cx="160" cy="236" rx="95" ry="12" fill="#1E0D42" opacity="0.05"/>

  <!-- lines: VMs running on the shared host -->
  <line x1="96" y1="76" x2="140" y2="114" stroke="#C4B5FD" stroke-width="2"/>
  <line x1="68" y1="150" x2="138" y2="150" stroke="#C4B5FD" stroke-width="2"/>
  <line x1="97" y1="221" x2="140" y2="187" stroke="#C4B5FD" stroke-width="2"/>

  <!-- VM 1: a small virtual display -->
  <rect x="66" y="58" width="30" height="21" rx="3" fill="#8355D6"/>
  <rect x="70" y="62" width="22" height="13" rx="1.4" fill="#FFFFFF" opacity="0.28"/>
  <rect x="77" y="79" width="8" height="4" fill="#8355D6"/>
  <rect x="72" y="83.4" width="18" height="2.4" rx="1.2" fill="#8355D6"/>

  <!-- VM 2 -->
  <rect x="38" y="139" width="30" height="21" rx="3" fill="#A78BFA"/>
  <rect x="42" y="143" width="22" height="13" rx="1.4" fill="#FFFFFF" opacity="0.28"/>
  <rect x="49" y="160" width="8" height="4" fill="#A78BFA"/>
  <rect x="44" y="164.4" width="18" height="2.4" rx="1.2" fill="#A78BFA"/>

  <!-- VM 3 -->
  <rect x="69" y="202" width="27" height="19" rx="3" fill="#C4B5FD"/>
  <rect x="73" y="205.5" width="19" height="12" rx="1.3" fill="#FFFFFF" opacity="0.3"/>
  <rect x="79" y="221" width="7" height="3.5" fill="#C4B5FD"/>
  <rect x="75" y="224.5" width="15" height="2.2" rx="1.1" fill="#C4B5FD"/>

  <!-- the host: a hypervisor running all three VMs -->
  <rect x="140" y="105" width="95" height="90" rx="10" fill="#6633BB"/>
  <rect x="152" y="122" width="71" height="6" rx="3" fill="#FFFFFF" opacity="0.3"/>
  <rect x="152" y="140" width="71" height="6" rx="3" fill="#FFFFFF" opacity="0.3"/>
  <rect x="152" y="158" width="71" height="6" rx="3" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="220" cy="178" r="4" fill="#4ADE80"/>

  <!-- flow: the host is continuously backed up -->
  <path d="M239 138Q305 103 355 137" stroke="#C4B5FD" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="1 7"/>
  <path d="M348 129l10 8-8 10" stroke="#C4B5FD" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the backup: a saved snapshot taken at a point in time -->
  <ellipse cx="405" cy="128" rx="30" ry="11" fill="#8355D6"/>
  <path d="M375 128V182A30 11 0 0 0 435 182V128" fill="#6633BB"/>
  <path d="M375 155A30 11 0 0 0 435 155" stroke="#FFFFFF" stroke-width="1.3" fill="none" opacity="0.3"/>

  <circle cx="432" cy="182" r="19" fill="#6633BB" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M432 182V173" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M432 182L439 178" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>

  <!-- sparkle accents -->
  <path d="M452 95l1.4 4.6 4.6 1.4-4.6 1.4-1.4 4.6-1.4-4.6-4.6-1.4 4.6-1.4Z" fill="#C4B5FD"/>
  <path d="M30 45l1 3.2 3.2 1-3.2 1-1 3.2-1-3.2-3.2-1 3.2-1Z" fill="#D9CCFF"/>
</svg>
