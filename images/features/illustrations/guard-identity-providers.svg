<svg viewBox="0 0 500 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four identity provider badges converging through a verification gate into one authenticated Kubernetes identity">
  <defs>
    <radialGradient id="illGlowTR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBE0CE" stop-opacity="0.85"/>
      <stop offset="20%" stop-color="#FCE3D3" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#FDE7DA" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#FEEEE3" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#FEF3EC" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FEF5EF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="illGlowBL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8D3B8" stop-opacity="0.75"/>
      <stop offset="20%" stop-color="#F9D8C0" stop-opacity="0.62"/>
      <stop offset="40%" stop-color="#FBDECB" stop-opacity="0.44"/>
      <stop offset="60%" stop-color="#FCE6D8" stop-opacity="0.26"/>
      <stop offset="80%" stop-color="#FDEEE6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FDEEE6" stop-opacity="0"/>
    </radialGradient>
    <filter id="illSoften" x="-100" y="-100" width="700" height="480" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <circle cx="424" cy="60" r="165" fill="url(#illGlowTR)" filter="url(#illSoften)"/>
  <circle cx="55" cy="248" r="135" fill="url(#illGlowBL)" filter="url(#illSoften)"/>
  <circle cx="472" cy="238" r="4" fill="#F6BFA0"/>
  <circle cx="26" cy="64" r="3" fill="#EE9B6C"/>

  <!-- ground shadow -->
  <ellipse cx="230" cy="248" rx="170" ry="12" fill="#3A1607" opacity="0.05"/>

  <!-- provider badges (abstract identities, no literal logos) -->
  <g>
    <rect x="54" y="44" width="52" height="52" rx="14" fill="#A83818"/>
    <circle cx="80" cy="70" r="9" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <g>
    <rect x="54" y="98" width="52" height="52" rx="14" fill="#D84E27"/>
    <rect x="71" y="115" width="18" height="18" rx="3" fill="#FFFFFF" transform="rotate(45 80 124)"/>
  </g>
  <g>
    <rect x="54" y="152" width="52" height="52" rx="14" fill="#E67A45"/>
    <path d="M80 168l11 19H69Z" fill="#FFFFFF"/>
  </g>
  <g>
    <rect x="54" y="206" width="52" height="52" rx="14" fill="#EF9D6E"/>
    <rect x="76" y="220" width="8" height="24" rx="3" fill="#FFFFFF"/>
    <rect x="68" y="228" width="24" height="8" rx="3" fill="#FFFFFF"/>
  </g>

  <!-- dashed flows converging to the gate -->
  <path d="M106 70Q182 92 228 132" stroke="#F5C1A0" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-dasharray="1 7"/>
  <path d="M106 124Q176 128 224 142" stroke="#F5C1A0" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-dasharray="1 7"/>
  <path d="M106 178Q176 172 224 158" stroke="#F5C1A0" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-dasharray="1 7"/>
  <path d="M106 232Q182 208 228 168" stroke="#F5C1A0" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-dasharray="1 7"/>

  <!-- verification pulse ring -->
  <circle cx="255" cy="150" r="42" stroke="#F5C1A0" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.6"/>

  <!-- the gate: Guard verifies and issues one identity -->
  <path d="M255 118L282 134V166L255 182L228 166V134Z" fill="#B23D1B"/>
  <path d="M244 150l7 7 14-15" stroke="#FFFFFF" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- flow out to the cluster -->
  <path d="M282 148Q328 132 366 148" stroke="#F5C1A0" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-dasharray="1 7"/>
  <path d="M358 141l9 7-7 9" stroke="#F5C1A0" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- cluster: one authenticated identity, recognized cluster-wide -->
  <path d="M400 116L429 133V167L400 184L371 167V133Z" fill="#E67A45"/>
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
    <circle cx="400" cy="150" r="5" fill="#FFFFFF" stroke="none"/>
    <line x1="400" y1="150" x2="400" y2="130"/>
    <line x1="400" y1="150" x2="418" y2="150"/>
    <line x1="400" y1="150" x2="400" y2="170"/>
    <line x1="400" y1="150" x2="382" y2="150"/>
  </g>

  <!-- authenticated badge -->
  <circle cx="424" cy="178" r="14" fill="#B23D1B"/>
  <path d="M417 178l5 5 11-11" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sparkle accents -->
  <path d="M455 55l1.4 4.6 4.6 1.4-4.6 1.4-1.4 4.6-1.4-4.6-4.6-1.4 4.6-1.4Z" fill="#F5C1A0"/>
  <path d="M35 220l1 3.2 3.2 1-3.2 1-1 3.2-1-3.2-3.2-1 3.2-1Z" fill="#FAD9C1"/>
</svg>
