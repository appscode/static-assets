<svg viewBox="0 0 500 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A terminal generating signed certificates and a webhook install manifest that deploys onto a Kubernetes cluster">
  <defs>
    <radialGradient id="illGlowTR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBE0CE" stop-opacity="0.85"/>
      <stop offset="20%" stop-color="#FCE3D3" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#FDE7DA" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#FEEEE3" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#FEF3EC" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FEF5EF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="illGlowBL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8D3B8" stop-opacity="0.75"/>
      <stop offset="20%" stop-color="#F9D8C0" stop-opacity="0.62"/>
      <stop offset="40%" stop-color="#FBDECB" stop-opacity="0.44"/>
      <stop offset="60%" stop-color="#FCE6D8" stop-opacity="0.26"/>
      <stop offset="80%" stop-color="#FDEEE6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FDEEE6" stop-opacity="0"/>
    </radialGradient>
    <filter id="illSoften" x="-100" y="-100" width="700" height="480" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <circle cx="424" cy="60" r="165" fill="url(#illGlowTR)" filter="url(#illSoften)"/>
  <circle cx="55" cy="248" r="135" fill="url(#illGlowBL)" filter="url(#illSoften)"/>
  <circle cx="472" cy="238" r="4" fill="#F6BFA0"/>
  <circle cx="26" cy="64" r="3" fill="#EE9B6C"/>

  <!-- ground shadow -->
  <ellipse cx="180" cy="248" rx="110" ry="12" fill="#3A1607" opacity="0.05"/>

  <!-- terminal shadow -->
  <rect x="66" y="63" width="190" height="150" rx="16" fill="#3A1607" opacity="0.07"/>
  <!-- terminal card -->
  <rect x="58" y="55" width="190" height="150" rx="16" fill="#FFFFFF" stroke="#EDE2D8" stroke-width="1.5"/>
  <!-- header bar -->
  <path d="M58 71a16 16 0 0 1 16-16h158a16 16 0 0 1 16 16v14H58Z" fill="#FBEBDE"/>
  <circle cx="76" cy="70" r="4" fill="#B23D1B"/>
  <circle cx="90" cy="70" r="4" fill="#D84E27"/>
  <circle cx="104" cy="70" r="4" fill="#E67A45"/>

  <!-- prompt line -->
  <path d="M74 103l7 6-7 6" stroke="#D84E27" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="90" y="105" width="110" height="8" rx="4" fill="#EDE2D8"/>

  <!-- verified output lines -->
  <circle cx="78" cy="130" r="7" fill="#B23D1B"/>
  <path d="M75 130l2.3 2.3L82 127.5" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="90" y="126" width="96" height="8" rx="4" fill="#F5C1A0"/>

  <circle cx="78" cy="153" r="7" fill="#B23D1B"/>
  <path d="M75 153l2.3 2.3L82 150.5" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="90" y="149" width="108" height="8" rx="4" fill="#F5C1A0"/>

  <circle cx="78" cy="176" r="7" fill="#B23D1B"/>
  <path d="M75 176l2.3 2.3L82 173.5" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="90" y="172" width="80" height="8" rx="4" fill="#F5C1A0"/>

  <!-- blinking cursor -->
  <rect x="72" y="190" width="16" height="10" rx="2" fill="#D84E27"/>

  <!-- flow to generated manifest -->
  <path d="M256 130Q288 118 310 128" stroke="#F5C1A0" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-dasharray="1 7"/>
  <path d="M302 121l9 6-6 9" stroke="#F5C1A0" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- generated installer manifest -->
  <path d="M312 96h28l12 12v38a4 4 0 0 1-4 4h-36a4 4 0 0 1-4-4v-46a4 4 0 0 1 4-4Z" fill="#E67A45"/>
  <path d="M340 96l12 12h-12Z" fill="#F5C1A0"/>
  <rect x="320" y="118" width="24" height="4" rx="2" fill="#FFFFFF"/>
  <rect x="320" y="127" width="18" height="4" rx="2" fill="#FFFFFF"/>
  <rect x="320" y="136" width="24" height="4" rx="2" fill="#FFFFFF"/>

  <!-- flow to cluster -->
  <path d="M356 138Q378 140 392 148" stroke="#F5C1A0" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-dasharray="1 7"/>
  <path d="M385 141l9 6-6 9" stroke="#F5C1A0" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- cluster hub deploying the guard server -->
  <circle cx="420" cy="150" r="42" stroke="#F5C1A0" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.55"/>
  <line x1="420" y1="150" x2="392" y2="112" stroke="#F5C1A0" stroke-width="2"/>
  <line x1="420" y1="150" x2="452" y2="118" stroke="#F5C1A0" stroke-width="2"/>
  <line x1="420" y1="150" x2="424" y2="196" stroke="#F5C1A0" stroke-width="2"/>

  <path d="M392 100L403 106.5V119.5L392 126L381 119.5V106.5Z" fill="#EF9D6E"/>
  <path d="M452 104L463 110.5V123.5L452 130L441 123.5V110.5Z" fill="#EF9D6E"/>
  <path d="M424 182L435 188.5V201.5L424 208L413 201.5V188.5Z" fill="#EF9D6E"/>

  <path d="M406 132L432 148V178L406 194L380 178V148Z" fill="#B23D1B"/>
  <path d="M395 163l7 7 14-15" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sparkle accents -->
  <path d="M471 62l1.4 4.6 4.6 1.4-4.6 1.4-1.4 4.6-1.4-4.6-4.6-1.4 4.6-1.4Z" fill="#F5C1A0"/>
  <path d="M40 100l1 3.2 3.2 1-3.2 1-1 3.2-1-3.2-3.2-1 3.2-1Z" fill="#FAD9C1"/>
</svg>
